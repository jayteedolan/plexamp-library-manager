# Plex Library Manager on a Raspberry Pi. Plex itself stays installed natively.
# See docs/SETUP.md before the first `docker compose up -d`.
services:
  app:
    image: ghcr.io/jayteedolan/plexamp-library-manager:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: library-manager
    restart: unless-stopped
    # Run as the owner of the music folder so new files belong to you (and Plex's group can read them).
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    ports:
      # Defaults to the Pi only; Tailscale Serve then publishes it over HTTPS (see SETUP.md).
      # For LAN testing before Tailscale is set up, set APP_BIND=0.0.0.0 in .env instead --
      # that exposes the login page to your whole network, so switch it back afterwards.
      - "${APP_BIND:-127.0.0.1}:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach the native Plex server
    volumes:
      # Mount the whole USB drive at the same path as on the host, so library/staging/trash share
      # one filesystem (instant moves) and Plex sees the same paths for targeted scans.
      - ${USB_ROOT:-/mnt/usb}:${USB_ROOT:-/mnt/usb}
      - ./data:/data

  # Only needed if slskd is not already installed on the Pi:  docker compose --profile slskd up -d
  # Config (Soulseek login, shares, downloads dir, API key) lives in ./slskd/slskd.yml -- see SETUP.md.
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    profiles: ["slskd"]
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - SLSKD_REMOTE_CONFIGURATION=false
    ports:
      - "127.0.0.1:5030:5030" # slskd web UI (use via Tailscale or an SSH tunnel)
      - "50300:50300"         # Soulseek peer port; forward this on your router for better connectivity
    volumes:
      - ./slskd/slskd.yml:/app/slskd.yml
      - slskd_data:/app
      # Same top-level mount as the app service below, so slskd.yml's absolute directories/shares
      # paths (under this drive) resolve identically in both containers.
      - ${USB_ROOT:-/mnt/usb}:${USB_ROOT:-/mnt/usb}

volumes:
  slskd_data:
